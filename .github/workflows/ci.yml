name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e './backend[dev]'
      - run: npm ci
        working-directory: frontend
      - run: npm run check-api && npm run typecheck && npm run lint && npm test && npm run build
        working-directory: frontend
        env:
          PYTHON: python

  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Install backend
        run: python -m pip install -e './backend[dev]'
      - name: Lint
        run: python -m ruff check backend
      - name: Type check
        run: python -m mypy --config-file backend/pyproject.toml backend/app
      - name: Test
        run: python -m pytest backend/tests
      - name: Rebuild frozen research artifacts
        run: |
          python scripts/generate_research_artifacts.py
          git diff --exit-code -- docs/figures results/strategy-study-v1
      - name: Build package
        run: pip install build && python -m build backend

  postgres-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: agentscope
          POSTGRES_DB: agentscope_test
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U agentscope -d agentscope_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://agentscope@localhost:5432/agentscope_test
      TEST_DATABASE_URL: postgresql+psycopg://agentscope@localhost:5432/agentscope_test
      AGENTSCOPE_RUN_DOCKER_TESTS: "1"
      AGENTSCOPE_RUN_PROVIDER_DOCKER_TESTS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e './backend[dev]'
      - run: docker build -t agentscope-runner:py312 -f docker/agent-runner.Dockerfile .
      - run: docker build -t agentscope-providers:codex-0.154.0-claude-2.1.220 -f docker/provider.Dockerfile .
      - run: alembic -c backend/alembic.ini upgrade head
      - run: alembic -c backend/alembic.ini check
      - run: python -m pytest backend/tests -m integration
      - name: Validate Compose
        env:
          POSTGRES_PASSWORD: compose-validation-placeholder
        run: docker compose config --quiet
